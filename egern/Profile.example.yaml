# ==============================================================================
# HTTPS 解密证书 (MITM) - 完全继承 Loon 的既有 CA 证书与私钥
# ==============================================================================
mitm:
  ca_p12: "<YOUR_CA_P12_BASE64>"
  ca_passphrase: "<YOUR_PASSPHRASE>"
  skip_server_cert_verify: false
