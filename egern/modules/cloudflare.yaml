name: "Cloudflare Workers 额度监控"
description: "定时查询 Cloudflare Workers 每日免费请求配额 (100,000次/天) 使用情况与用量监控。留空自动读取 BoxJS/本地存储。"
author: "fishyo"
homepage: "https://github.com/fishyo/someLoonThings"
icon: "https://fastly.jsdelivr.net/gh/fishyo/someLoonThings@main/icons/cloudflare.png"

compat_arguments:
  CRON_EXP: "0 8 * * *"
  ALERT_THRESHOLD: "80"
compat_arguments_desc: "CRON_EXP: 定时查询 Cron 表达式，默认每天 08:00 (UTC 00:00 重置); ALERT_THRESHOLD: 预警阈值(%)"

env_schema:
  CF_ACCOUNT_ID:
    name: "Account ID"
    description: "Cloudflare 仪表盘右侧的 32 位 Account ID（留空读取 BoxJS）"
    default_value: ""
  CF_API_TOKEN:
    name: "API Token"
    description: "Cloudflare API 令牌（需具备 Workers 只读权限，留空读取 BoxJS）"
    default_value: ""

scriptings:
  - schedule:
      name: "Cloudflare Workers Status"
      cron: "{{{CRON_EXP}}}"
      script_url: "https://fastly.jsdelivr.net/gh/fishyo/someLoonThings@main/script/cloudflare/cloudflare.js"
      timeout: 60
