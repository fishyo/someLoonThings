name: Upstream Sync - 嗅探上游新增代理域名

on:
  schedule:
    - cron: '0 2 * * 1' # 每周一 UTC 02:00 (北京时间 10:00) 自动巡检
  workflow_dispatch:     # 支持在 GitHub 页面手动一键触发巡检

permissions:
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    name: 嗅探上游可靠源并生成审批清单
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 执行上游差分与覆盖度分析
        run: node .github/scripts/sync-upstream.js --ci

      - name: 检查是否有新增待审域名
        id: check_diff
        run: |
          if [ -s staging/candidates.txt ]; then
            COUNT=$(grep -c '[^[:space:]]' staging/candidates.txt || true)
            echo "has_candidates=true" >> $GITHUB_OUTPUT
            echo "count=$COUNT" >> $GITHUB_OUTPUT
            echo "发现 $COUNT 个待审批新域名"
          else
            echo "has_candidates=false" >> $GITHUB_OUTPUT
            echo "未发现任何需要新增的域名，规则库已是最优状态"
          fi

      - name: 创建待审批 Pull Request
        if: steps.check_diff.outputs.has_candidates == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(rules): 上游发现 ${{ steps.check_diff.outputs.count }} 个待审批代理域名"
          branch: "upstream-sync/candidates"
          delete-branch: true
          title: "🛰️ [待审批] 发现 ${{ steps.check_diff.outputs.count }} 个上游新增代理域名"
          body-path: staging/candidates.md
          labels: |
            rules
            upstream-sync
            need-review
